[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-agent-harness"
version = "0.1.0"
description = "A local-first Python Agent Harness"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "keyring>=25,<27",
  "pywin32>=306; sys_platform == 'win32'",
  "mcp>=1.26,<3",
  "python-multipart>=0.0.20,<1",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "PyMySQL[rsa]>=1.1,<3",
  "sqlglot>=28,<29",
  "croniter>=6,<7",
  "tzdata>=2025.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["backend*"]
